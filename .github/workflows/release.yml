# Publishes a GitHub Release when a version tag (v*) is pushed. Everything is built here, in public,
# from the tagged source:
#   grammarme-companion.mjs                    companion for people with Node.js 22.6+ (~90 KB)
#   grammarme-companion-<os>-<arch>.tar.gz     standalone companion with Node built in (~40 MB)
#   GrammarMe-extension.zip                    the Chrome extension, ready for "Load unpacked"
#   install.sh                                 the one-line installer (also served by GitHub Pages)
#   SHA256SUMS                                 checksums; install.sh refuses anything that doesn't match
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v0.1.2)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:site
      - run: npm run build -w apps/companion
      - name: Collect files
        run: |
          mkdir -p out
          cp apps/companion/dist/grammarme-companion.mjs out/
          cp apps/site/dist/GrammarMe-extension.zip out/
          cp apps/companion/install.sh out/
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: out/*

  standalone:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon; the Intel Mac build is cross-built on the same runner (step below),
          # because GitHub's Intel macOS runner images are being retired.
          - { runner: macos-latest, target: darwin-arm64 }
          - { runner: ubuntu-latest, target: linux-x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    # A missing runner type must not block the release; install.sh falls back to the Node build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:sea -w apps/companion
      - name: Check the target
        run: test -f "apps/companion/dist/grammarme-companion-${{ matrix.target }}.tar.gz"
      # Node's single executable blob is platform-independent when snapshot and code cache are off
      # (as in scripts/build-sea.mjs), so the Intel build injects the same program into Node's
      # official darwin-x64 binary, verified against nodejs.org's SHASUMS256.txt.
      - name: Cross-build the Intel Mac version
        if: matrix.target == 'darwin-arm64'
        working-directory: apps/companion/dist
        run: |
          set -eu
          V="$(node -p process.version)"
          curl -fsSLO "https://nodejs.org/dist/$V/node-$V-darwin-x64.tar.gz"
          curl -fsSLO "https://nodejs.org/dist/$V/SHASUMS256.txt"
          grep " node-$V-darwin-x64.tar.gz\$" SHASUMS256.txt | shasum -a 256 -c -
          tar -xzf "node-$V-darwin-x64.tar.gz"
          printf '{"main":"%s","output":"sea-x64.blob","disableExperimentalSEAWarning":true,"useSnapshot":false,"useCodeCache":false}' "$PWD/grammarme-companion.cjs" > sea-x64.json
          node --experimental-sea-config sea-x64.json
          cp "node-$V-darwin-x64/bin/node" grammarme-companion-darwin-x64
          chmod 755 grammarme-companion-darwin-x64
          codesign --remove-signature grammarme-companion-darwin-x64
          node ../../../node_modules/postject/dist/cli.js grammarme-companion-darwin-x64 NODE_SEA_BLOB sea-x64.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 --macho-segment-name NODE_SEA
          codesign --sign - grammarme-companion-darwin-x64
          file grammarme-companion-darwin-x64 | grep -q x86_64
          (arch -x86_64 ./grammarme-companion-darwin-x64 --version) || echo "Rosetta not available on this runner; skipped the run test"
          tar -czf grammarme-companion-darwin-x64.tar.gz grammarme-companion-darwin-x64
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.target }}
          path: apps/companion/dist/grammarme-companion-*.tar.gz

  publish:
    needs: [bundle, standalone]
    if: always() && needs.bundle.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create or update the release
        run: |
          notes="Install or update the ChatGPT companion (macOS, Linux):

          \`\`\`
          curl -fsSL https://bachnguyennn.github.io/GrammarMe/companion/install.sh | sh
          \`\`\`

          Extension: download GrammarMe-extension.zip and follow https://bachnguyennn.github.io/GrammarMe/install.html
          What's new: https://github.com/${{ github.repository }}/blob/${TAG}/CHANGELOG.md"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" --title "GrammarMe ${TAG#v}" --notes "$notes"
          fi
          gh release upload "$TAG" assets/* --repo "${{ github.repository }}" --clobber
